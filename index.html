<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Klusly | Kluscalculator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #18212b;
}

header {
  background: #111827;
  color: white;
  padding: 25px 20px;
  text-align: center;
}

.logo {
  font-size: 34px;
  font-weight: 800;
}

.logo span {
  color: #f59e0b;
}

header p {
  margin: 6px 0 0;
  color: #d1d5db;
}

.container {
  max-width: 650px;
  margin: 25px auto;
  padding: 0 16px 40px;
}

.card {
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 17px;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  font-size: 16px;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 24px;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #f59e0b;
  color: #111827;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.resultaat {
  display: none;
  margin-top: 25px;
  background: #111827;
  color: white;
  padding: 22px;
  border-radius: 14px;
}

.rij {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
}

.totaal {
  margin-top: 10px;
  padding-top: 15px;
  border-top: 1px solid #4b5563;
  font-size: 23px;
  font-weight: bold;
  color: #fbbf24;
}

.kleineTekst {
  font-size: 13px;
  color: #9ca3af;
  text-align: center;
  margin-top: 20px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Klus<span>ly</span></div>
  <p>Van klus naar prijs in 60 seconden.</p>
</header>

<div class="container">

  <div class="card">

    <h2>Bereken je klus</h2>

<h3>Mijn bedrijfsgegevens</h3>

<label>Bedrijfsnaam</label>
<input type="text" id="bedrijfsnaam" placeholder="Naam van je bedrijf">

<label>Bedrijfsadres</label>
<input type="text" id="bedrijfsadres" placeholder="Straat, postcode en plaats">

<label>Telefoonnummer</label>
<input type="tel" id="bedrijfstelefoon" placeholder="06...">

<label>E-mailadres</label>
<input type="email" id="bedrijfsemail" placeholder="info@bedrijf.nl">
  
    <label>Klantnaam</label>
    <input type="text" id="klant" placeholder="Bijv. Jan de Vries">

    <label>Soort klus</label>
    <select id="klus">
      <option>Timmerwerk</option>
      <option>Schilderwerk</option>
      <option>Stucwerk</option>
      <option>Tegelwerk</option>
      <option>Loodgieterswerk</option>
      <option>Elektrawerk</option>
      <option>Hovenierswerk</option>
      <option>Dakwerk</option>
      <option>Vloerwerk</option>
      <option>Overig</option>
    </select>

    <label>Omschrijving</label>
    <textarea id="omschrijving"
      placeholder="Bijv. woonkamer schilderen"></textarea>

    <label>Materiaalkosten (€)</label>
    <input type="number" id="materiaal" min="0" step="0.01" placeholder="250">

    <label>Aantal werkuren</label>
    <input type="number" id="uren" min="0" step="0.5" placeholder="16">

    <label>Uurloon (€)</label>
    <input type="number" id="uurloon" min="0" step="0.01" placeholder="45">

    <label>Overige kosten (€)</label>
    <input type="number" id="overig" min="0" step="0.01" placeholder="50">

    <label>BTW</label>
    <select id="btw">
      <option value="21">21%</option>
      <option value="9">9%</option>
      <option value="0">0%</option>
    </select>

    <button onclick="bereken()">Bereken klusprijs →</button>

    <div class="resultaat" id="resultaat">

      <h2>Prijsberekening</h2>

      <div class="rij">
        <span>Materiaal</span>
        <span id="materiaalResultaat"></span>
      </div>

      <div class="rij">
        <span>Arbeid</span>
        <span id="arbeidResultaat"></span>
      </div>

      <div class="rij">
        <span>Overige kosten</span>
        <span id="overigResultaat"></span>
      </div>

      <div class="rij">
        <span>Subtotaal</span>
        <span id="subtotaalResultaat"></span>
      </div>

      <div class="rij">
        <span>BTW</span>
        <span id="btwResultaat"></span>
      </div>

      <div class="rij totaal">
        <span>TOTAAL</span>
        <span id="totaalResultaat"></span>
      </div>

    </div>

  </div>

  <div class="kleineTekst">
    Klusly • Slim calculeren voor vakmensen
  </div>

</div>

<script>
function euro(bedrag) {
  return bedrag.toLocaleString("nl-NL", {
    style: "currency",
    currency: "EUR"
  });
}

function getNummer(id) {
  return parseFloat(document.getElementById(id).value) || 0;
}

function bereken() {

  const materiaal = getNummer("materiaal");
  const uren = getNummer("uren");
  const uurloon = getNummer("uurloon");
  const overig = getNummer("overig");

  const btwPercentage =
    parseFloat(document.getElementById("btw").value);

  const arbeid = uren * uurloon;

  const subtotaal =
    materiaal + arbeid + overig;

  const btw =
    subtotaal * (btwPercentage / 100);

  const totaal =
    subtotaal + btw;

  document.getElementById("materiaalResultaat").textContent =
    euro(materiaal);

  document.getElementById("arbeidResultaat").textContent =
    euro(arbeid);

  document.getElementById("overigResultaat").textContent =
    euro(overig);

  document.getElementById("subtotaalResultaat").textContent =
    euro(subtotaal);

  document.getElementById("btwResultaat").textContent =
    euro(btw) + " (" + btwPercentage + "%)";

  document.getElementById("totaalResultaat").textContent =
    euro(totaal);

  document.getElementById("resultaat").style.display =
    "block";
}
</script>

<button type="button" id="offerteKnop" onclick="maakOfferte()" style="display:none; margin:20px auto; padding:15px 25px; background:#f0a532; border:0; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer;">
  Offerte opslaan als PDF
</button>

<script>
const offerteResultaat = document.getElementById("resultaat");
const offerteKnop = document.getElementById("offerteKnop");

if (offerteResultaat) {
  const observer = new MutationObserver(() => {
    offerteKnop.style.display =
      getComputedStyle(offerteResultaat).display === "none"
        ? "none" : "block";
  });

  observer.observe(offerteResultaat, {
    attributes: true,
    attributeFilter: ["style"]
  });
}
</script>

<script>
function maakOfferte() {
  const klant = document.querySelector('input[placeholder*="Jan"]')?.value || "Klant";
  const omschrijving = document.querySelector('textarea')?.value || "";
  const resultaat = document.getElementById("resultaat");
const bedrijfsnaam = document.getElementById("bedrijfsnaam")?.value || "";
const bedrijfsadres = document.getElementById("bedrijfsadres")?.value || "";
const bedrijfstelefoon = document.getElementById("bedrijfstelefoon")?.value || "";
const bedrijfsemail = document.getElementById("bedrijfsemail")?.value || "";
  if (!resultaat || getComputedStyle(resultaat).display === "none") {
    alert("Bereken eerst de klusprijs.");
    return;
  }

  const geldigeTekst = (tekst) => String(tekst).replace(/[&<>"']/g, teken => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[teken]);

  const venster = window.open("", "_blank");
  if (!venster) {
    alert("Sta pop-ups toe om de offerte te openen.");
    return;
  }

  venster.document.write(`
    <!DOCTYPE html>
    <html lang="nl">
    <head>
      <meta charset="UTF-8">
      <title>Klusly Offerte</title>
      <style>
        body { font-family: Arial, sans-serif; padding: 35px; color: #18212b; }
        h1 { color: #111827; }
        .kop { border-bottom: 3px solid #efa537; padding-bottom: 15px; }
        .prijs { margin-top: 25px; }
        .prijs div { display: flex; justify-content: space-between; padding: 9px 0; }
        .totaal { font-size: 22px; font-weight: bold; border-top: 2px solid #111827; }
        .voet { margin-top: 45px; color: #666; font-size: 12px; }
        @media print { body { padding: 10px; } }
      </style>
    </head>
    <body>
      <div class="kop">
        <h1>Klusly</h1>
        <h2>OFFERTE</h2>
        <p>Datum: ${new Date().toLocaleDateString("nl-NL")}</p>
      </div><div class="bedrijfsgegevens">
  <p><strong>Bedrijf:</strong> ${geldigeTekst(bedrijfsnaam)}</p>
  <p><strong>Adres:</strong> ${geldigeTekst(bedrijfsadres)}</p>
  <p><strong>Telefoon:</strong> ${geldigeTekst(bedrijfstelefoon)}</p>
  <p><strong>E-mail:</strong> ${geldigeTekst(bedrijfsemail)}</p>
</div>
      <p><strong>Klant:</strong> ${geldigeTekst(klant)}</p>
      <p><strong>Werkzaamheden:</strong> ${geldigeTekst(omschrijving)}</p>
      <div class="prijs">
        ${resultaat.innerHTML}
      </div>
      <div class="voet">Deze offerte is opgesteld met Klusly.</div>
    </body>
    </html>
  `);
  venster.document.close();
  venster.focus();
  setTimeout(() => venster.print(), 400);
}
</script>

</body>
</html>
